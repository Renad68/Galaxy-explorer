
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Abandoned but Not Forgotten</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="space contact-page">

        <header class="navbar">

            <a href="index.html" class="logo">
                <span class="logo-icon">◐</span>
                <span>SPACE EXPLORER</span>
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="explore.html">Explore</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>

        </header>
        <main class="contact-main">
            <section class="contact-content">

                <p class="eyebrow">
                    <span class="status-dot"></span>
                    GET IN TOUCH
                </p>

                <h1>
                    CONTACT
                    <br>
                    US<span class="period">.</span>
                </h1>

                <p class="contact-description">
                    Have a question about a space mission or an object
                    left behind beyond Earth? Send us a message.
                    We'd love to hear from you.
                </p>

            </section>
            <section class="contact-form-section">

                <form class="contact-form" action="#" method="post">

                    <div class="form-group">
                        <label for="name">YOUR NAME</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            autocomplete="name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="email">EMAIL ADDRESS</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="message">YOUR MESSAGE</label>

                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            placeholder="Write your message here..."
                            required
                        ></textarea>
                    </div>


                    <button type="submit" class="send-btn">
                        SEND MESSAGE
                        <span>↗</span>
                    </button>

                </form>

            </section>

        </main>

    </div>

</body>
</html>
